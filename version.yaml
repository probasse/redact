      added:
        - "Core document redaction functionality"
        - "Professional landing page redesign with modern UI"
        - "Stripe checkout integration for subscriptions"
        - "Free tier with 5 document limit"
        - "Docker and Docker Compose configuration"
        - "Firestore database integration"
        - "Theme toggle with dark mode support"
        - "Tax Estimator link in footer"
      changed:
        - "Optimized Docker deployment with Gunicorn"
        - "Separate environment configurations for testing and production"
      fixed:
        - "Theme toggle visibility in dark mode"
        - "Navigation links updated"
    breaking_changes: []

